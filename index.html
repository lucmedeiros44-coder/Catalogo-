<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Pro PDF v8</title>
<script src="https://cloudflare.com"></script>
<script src="https://cloudflare.com"></script>
<style>
  *{box-sizing:border-box;font-family:sans-serif}body{margin:0;background:#f3f4f6;color:#1f2937}
  .box{max-width:960px;margin:0 auto;padding:12px}.card{background:#fff;padding:14px;border-radius:10px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  label{display:block;font-size:11px;font-weight:700;color:#4b5563;margin-bottom:3px;text-transform:uppercase}
  input,select,textarea{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:7px;font-size:14px}
  button{cursor:pointer;border:none;border-radius:7px;font-weight:700;padding:10px 14px;font-size:13px;color:#fff}
  .row{display:flex;justify-content:space-between;align-items:center;border:1px solid #e5e7eb;padding:7px;border-radius:7px;margin-bottom:5px;background:#f9fafb}
</style>
</head>
<body>
<div class="box">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <div><b style="font-size:18px">Catálogo Pro PDF</b> <span id="st" style="font-size:11px;background:#fee2e2;color:#dc2626;padding:3px 7px;border-radius:5px">🔴 Erro JS</span></div>
    <button id="bPdf" style="background:#16a34a">📄 BAIXAR PDF</button>
  </div>
  <div class="card g4">
    <div><label>Nome da Loja</label><input id="loja" value="Loja Simone Lit"></div>
    <div><label>Link do Site</label><input id="site" value="https://simonelit.com.br"></div>
    <div><label>WhatsApp</label><input id="wpp" value="553132843022"></div>
    <div><label>Máx. Produtos</label><input type="number" id="max" value="12"></div>
  </div>
  <div class="card g3">
    <div><label>Cor Tema</label><input type="color" id="cor" value="#1e293b" style="height:38px"></div>
    <div><label>Fonte (pt)</label><input type="number" id="fnt" value="11"></div>
    <div><label>Por Linha</label><select id="col"><option value="1">1 Grande</option><option value="2" selected>2 Padrão</option><option value="3">3 Compacto</option></select></div>
  </div>
  <div class="card" style="background:#eef2ff">
    <label style="color:#312e81">Importar por Link ou Colar Texto/HTML da Loja</label>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <input id="urlImp" value="https://simonelit.com.br" style="flex:2">
      <input id="catImp" value="Destaques" style="flex:1">
      <button id="bImp" style="background:#4f46e5">Importar</button>
    </div>
    <textarea id="txtImp" rows="2" placeholder="Ou cole aqui o Ctrl+A / Ctrl+U da página da loja..."></textarea>
    <button id="bColar" style="background:#2563eb;width:100%;margin-top:6px">Extrair do Texto Colado</button>
    <div id="msgImp" style="font-size:12px;font-weight:bold;margin-top:6px"></div>
  </div>
  <div class="card">
    <label>Adicionar Manualmente</label>
    <div class="g3" style="margin-bottom:8px">
      <input id="pNome" placeholder="Nome do produto"><input id="pCat" placeholder="Categoria"><input id="pPreco" placeholder="R$ 0,00">
    </div>
    <div style="display:flex;gap:8px">
      <input type="file" id="pImg" accept="image/*" style="flex:1"><button id="bAdd" style="background:#2563eb">+ Adicionar</button>
    </div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px"><label>Lista (<span id="qtd">0</span>)</label><button id="bLimpar" style="background:#dc2626;padding:4px 8px;font-size:11px">Limpar</button></div>
    <div id="lista"></div>
  </div>
</div>
<div id="qr" style="display:none"></div>
<script>
var itens=[];
function render(){
  document.getElementById("qtd").innerText=itens.length;
  document.getElementById("lista").innerHTML=itens.map(function(p,i){
    return '<div class="row"><span><b>'+p.n+'</b> ('+p.c+') - '+p.p+'</span><button onclick="itens.splice('+i+',1);render()" style="background:#dc2626;padding:3px 7px;font-size:11px">X</button></div>';
  }).join("");
}
document.getElementById("bAdd").onclick=function(){
  var n=document.getElementById("pNome").value.trim();if(!n)return alert("Digite o nome");
  var c=document.getElementById("pCat").value.trim()||"Geral",p=document.getElementById("pPreco").value.trim(),f=document.getElementById("pImg");
  var push=function(img){itens.push({n:n,c:c,p:p,img:img,l:document.getElementById("site").value});document.getElementById("pNome").value="";f.value="";render();};
  if(f.files&&f.files.length){var r=new FileReader();r.onload=function(e){push(e.target.result)};r.readAsDataURL(f.files.item(0));}else push(null);
};
document.getElementById("bLimpar").onclick=function(){itens=[];render();};
function parseHtml(h,cat,base){
  var doc=new DOMParser().parseFromString(h,"text/html"),cards=doc.querySelectorAll(".js-item-product,.item-product,.product,.grid-item"),add=0,max=parseInt(document.getElementById("max").value)||12;
  cards.forEach(function(el){
    if(add>=max)return;
    var t=el.querySelector(".js-item-name,.item-name,h2,h3,a[title]"),pr=el.querySelector(".js-price-display,.item-price,.price"),a=el.querySelector("a");
    var nome=t?(t.getAttribute("title")||t.innerText).trim():"";if(!nome)return;
    itens.push({n:nome,c:cat,p:pr?pr.innerText.trim().split("\n").shift():"",img:null,l:a?a.getAttribute("href"):base});add++;
  });
  if(!add){
    h.split("\n").forEach(function(l,idx,arr){
      if(add<max&&l.trim().indexOf("R$")===0&&idx>0){
        var prev=arr.slice(idx-1,idx).shift().trim();
        if(prev.length>4&&prev.indexOf("R$")!==0){itens.push({n:prev,c:cat,p:l.trim(),img:null,l:base});add++;}
      }
    });
  }
  render();return add;
}
document.getElementById("bImp").onclick=async function(){
  var u=document.getElementById("urlImp").value.trim(),c=document.getElementById("catImp").value.trim()||"Geral",m=document.getElementById("msgImp");
  m.innerText="Buscando...";
  try{
    var r=await fetch("https://codetabs.com"+encodeURIComponent(u));
    var txt=await r.text(),n=parseHtml(txt,c,u);
    m.innerText=n?("✅ "+n+" itens importados!"):"⚠️ Site bloqueou. Cole o texto abaixo!";
  }catch(e){m.innerText="❌ Erro de conexão. Use a caixa de texto abaixo!";}
};
document.getElementById("bColar").onclick=function(){
  var txt=document.getElementById("txtImp").value.trim();if(!txt)return alert("Cole o texto primeiro");
  var n=parseHtml(txt,document.getElementById("catImp").value.trim()||"Geral",document.getElementById("site").value);
  document.getElementById("msgImp").innerText=n?("✅ "+n+" itens extraídos!"):"❌ Nada encontrado.";
  if(n)document.getElementById("txtImp").value="";
};
document.getElementById("bPdf").onclick=async function(){
  if(!itens.length)return alert("Adicione itens primeiro");
  var doc=new window.jspdf.jsPDF(),w=doc.internal.pageSize.getWidth(),h=doc.internal.pageSize.getHeight();
  var loja=document.getElementById("loja").value,site=document.getElementById("site").value,wpp="https://wa.me"+document.getElementById("wpp").value.replace(/\D/g,"");
  var cols=parseInt(document.getElementById("col").value)||2,fnt=parseInt(document.getElementById("fnt").value)||11;
  var cw=(w-20-(cols-1)*6)/cols,ch=cols===1?110:75,ih=cols===1?75:45,col=0,y=22;
  doc.setFillColor(30,41,59);doc.rect(10,8,w-20,10,"F");doc.setTextColor(255,255,255);doc.setFontSize(12);doc.text(loja.toUpperCase(),14,14.5);
  for(var i=0;i<itens.length;i++){
    var it=itens.slice(i,i+1).shift();
    if(y+ch>h-20){doc.addPage();y=15;col=0;}
    var x=10+col*(cw+6);doc.setDrawColor(220);doc.rect(x,y,cw,ch);
    if(it.img)try{doc.addImage(it.img,"JPEG",x+2,y+2,cw-4,ih);}catch(e){}
    doc.link(x+2,y+2,cw-4,ih,{url:it.l||site});
    doc.setTextColor(20);doc.setFontSize(fnt);doc.text(it.n.substring(0,26),x+3,y+ih+7);
    doc.setTextColor(22,163,74);doc.text(it.p,x+3,y+ih+13);
    col++;if(col>=cols){col=0;y+=ch+6;}
  }
  doc.setFillColor(30,41,59);doc.rect(w-88,h-15,38,8,"F");doc.setTextColor(255);doc.setFontSize(8);doc.text("VER NO SITE",w-69,h-9.5,{align:"center"});doc.link(w-88,h-15,38,8,{url:site});
  doc.setFillColor(22,163,74);doc.rect(w-48,h-15,38,8,"F");doc.text("WHATSAPP",w-29,h-9.5,{align:"center"});doc.link(w-48,h-15,38,8,{url:wpp});
  doc.save("Catalogo.pdf");
};
var st=document.getElementById("st");st.innerText="🟢 v8.0 Ativo";st.style.background="#dcfce7";st.style.color="#15803d";
</script>
</body>
</html>
