<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lookbook PDF v20</title>
<script src="https://jsdelivr.net"></script>
<style>
*{box-sizing:border-box;font-family:sans-serif}body{margin:0;background:#f3f4f6;color:#1f2937;padding-bottom:30px}
.box{max-width:900px;margin:0 auto;padding:12px}.card{background:#fff;padding:14px;border-radius:10px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
label{display:block;font-size:11px;font-weight:700;color:#4b5563;margin-bottom:4px;text-transform:uppercase}
input,select{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:7px;font-size:14px}
button{cursor:pointer;border:none;border-radius:7px;font-weight:700;padding:10px 14px;font-size:13px;color:#fff}
button:disabled{opacity:.6;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.item{position:relative;border-radius:8px;overflow:hidden;border:1px solid #e5e7eb;background:#fff;display:flex;flex-direction:column}
.item-img{aspect-ratio:3/4;background:#f9fafb;position:relative}
.item-img img{width:100%;height:100%;object-fit:cover}
.item-info{padding:6px;display:flex;flex-direction:column;gap:4px}
.item-info input{padding:4px 6px;font-size:12px}
.del{position:absolute;top:5px;right:5px;background:#dc2626;color:#fff;border-radius:50%;width:22px;height:22px;padding:0;font-size:11px}
</style>
</head>
<body>
<div class="box">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
    <div><b style="font-size:18px">Lookbook PDF</b> <span id="st" style="font-size:11px;background:#fef3c7;color:#b45309;padding:3px 7px;border-radius:6px">⏳ Carregando...</span></div>
    <button id="bPdf" style="background:#16a34a">📄 BAIXAR PDF</button>
  </div>

  <div class="card g3">
    <div><label>Loja</label><input id="loja" value="Loja Simone Lit"></div>
    <div><label>Site</label><input id="site" value="https://simonelit.com"></div>
    <div><label>WhatsApp</label><input id="wpp" value="553132843022"></div>
  </div>

  <div class="card g3">
    <div><label>Cor Tema</label><input type="color" id="cor" value="#1e293b" style="height:38px;padding:2px"></div>
    <div><label>Fotos/Linha</label><select id="col"><option value="1">1 Grande</option><option value="2" selected>2 Padrão</option><option value="3">3 Compacto</option></select></div>
    <div><label>Capa</label><input id="capa" value="NOVA COLEÇÃO"></div>
  </div>

  <div class="card">
    <label>Importar Produto pelo Link da Página</label>
    <div style="display:flex;gap:8px">
      <input id="pUrl" placeholder="Cole o link da página do produto (ex: https://simonelit.com...)">
      <button id="bBuscar" style="background:#2563eb;white-space:nowrap">🔍 Puxar Produto</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <label style="margin:0">Produtos (<span id="qtd">0</span>)</label>
      <button id="bLimpar" style="background:#dc2626;padding:4px 8px;font-size:11px">Limpar</button>
    </div>
    <div id="grid" class="grid"></div>
  </div>
</div>

<script>
window.onerror=function(m,u,l){var s=document.getElementById("st");s.innerText="⚠️ L"+l+": "+m;s.style.background="#fee2e2";s.style.color="#dc2626";};
var itens=[];

function render(){
  document.getElementById("qtd").innerText=itens.length;
  if(!itens.length){document.getElementById("grid").innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px;color:#9ca3af;font-size:13px">Nenhum produto importado. Cole o link acima.</div>';return;}
  document.getElementById("grid").innerHTML=itens.map(function(it,i){
    return '<div class="item"><div class="item-img"><img src="'+it.img+'" onerror="this.src=\'https://placehold.co\'"><button class="del" onclick="itens.splice('+i+',1);render()">✕</button></div><div class="item-info"><input value="'+(it.nome||'')+'" placeholder="Nome" onchange="itens['+i+'].nome=this.value"><input value="'+(it.preco||'')+'" placeholder="Preço" onchange="itens['+i+'].preco=this.value"><input value="'+(it.l||'')+'" placeholder="Link" onchange="itens['+i+'].l=this.value"></div></div>';
  }).join("");
}

document.getElementById("bBuscar").onclick=async function(){
  var url=document.getElementById("pUrl").value.trim();
  if(!url)return alert("Cole o link da página do produto.");
  if(!/^https?:\/\//i.test(url))url="https://"+url;
  var btn=this;btn.innerText="⏳ Buscando...";btn.disabled=true;
  try{
    var res=await fetch("https://allorigins.win"+encodeURIComponent(url));
    var data=await res.json();
    if(!data||!data.contents)throw new Error("Página inacessível.");
    var doc=new DOMParser().parseFromString(data.contents,"text/html");
    var meta=function(p){var e=doc.querySelector('meta[property="'+p+'"],meta[name="'+p+'"]');return e?e.getAttribute("content"):"";};
    var img=meta("og:image")||meta("twitter:image");
    var nome=(meta("og:title")||doc.title||"").split("-")[0].trim();
    var preco=meta("product:price:amount")||meta("og:price:amount");
    if(preco&&!preco.includes("R$"))preco="R$ "+parseFloat(preco).toFixed(2).replace(".",",");
    if(!img)throw new Error("Foto não encontrada neste link.");
    itens.push({img:img,l:url,nome:nome,preco:preco||""});
    document.getElementById("pUrl").value="";
    render();
  }catch(e){alert("Erro: "+e.message);}
  btn.innerText="🔍 Puxar Produto";btn.disabled=false;
};

document.getElementById("bLimpar").onclick=function(){if(itens.length&&confirm("Limpar tudo?")){itens=[];render();}};

function toB64(src){
  return new Promise(function(res){
    var u="https://weserv.nl"+encodeURIComponent(src.replace(/^https?:\/\//,""))+"&w=800&output=jpg";
    var img=new Image();img.crossOrigin="Anonymous";
    img.onload=function(){var c=document.createElement("canvas");c.width=img.width;c.height=img.height;var x=c.getContext("2d");x.fillStyle="#FFF";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0);res(c.toDataURL("image/jpeg",.85));};
    img.onerror=function(){res(null);};
    img.src=u;
  });
}

document.getElementById("bPdf").onclick=async function(){
  if(!itens.length)return alert("Importe produtos primeiro.");
  var btn=this;btn.innerText="⏳ Gerando...";btn.disabled=true;
  try{
    var Ctor=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
    if(!Ctor)throw new Error("jsPDF não carregado.");
    var doc=new Ctor(),w=doc.internal.pageSize.getWidth(),h=doc.internal.pageSize.getHeight();
    var loja=document.getElementById("loja").value||"Lookbook",site=document.getElementById("site").value,wppNum=document.getElementById("wpp").value.replace(/\D/g,""),wpp="https://wa.me"+wppNum;
    var hex=document.getElementById("cor").value.replace("#",""),n=parseInt(hex,16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    var cols=parseInt(document.getElementById("col").value)||2;

    doc.setFillColor(r,g,b);doc.rect(0,0,w,h,"F");doc.setTextColor(255);
    doc.setFontSize(26);doc.text(loja.toUpperCase(),w/2,h/2-8,{align:"center"});
    doc.setFontSize(13);doc.text(document.getElementById("capa").value.toUpperCase(),w/2,h/2+8,{align:"center"});

    var rodape=function(){
      doc.setFillColor(r,g,b);doc.roundedRect(w-92,h-17,40,9,2,2,"F");doc.setTextColor(255);doc.setFontSize(8);doc.text("VER NO SITE",w-72,h-11.5,{align:"center"});doc.link(w-92,h-17,40,9,{url:site});
      if(wppNum){doc.setFillColor(22,163,74);doc.roundedRect(w-50,h-17,40,9,2,2,"F");doc.text("WHATSAPP",w-30,h-11.5,{align:"center"});doc.link(w-50,h-17,40,9,{url:wpp});}
    };

    doc.addPage();var m=10,gap=7,cw=(w-m*2-gap*(cols-1))/cols,ch=cols===1?200:(cols===2?105:70),col=0,y=14;
    for(var i=0;i<itens.length;i++){
      var it=itens[i],txt=it.nome||it.preco,bh=ch+(txt?11:0);
      if(y+bh>h-22){rodape();doc.addPage();y=14;col=0;}
      var x=m+col*(cw+gap),b64=await toB64(it.img);
      if(b64)doc.addImage(b64,"JPEG",x,y,cw,ch);else{doc.setFillColor(240);doc.rect(x,y,cw,ch,"F");}
      if(txt){
        doc.setTextColor(31,41,55);doc.setFontSize(cols===3?7.5:9);
        if(it.nome)doc.text(doc.splitTextToSize(it.nome,cw)[0],x,y+ch+4.5);
        if(it.preco){doc.setTextColor(r,g,b);doc.setFont(undefined,"bold");doc.text(it.preco,x,y+ch+(it.nome?9:4.5));doc.setFont(undefined,"normal");}
      }
      doc.link(x,y,cw,bh,{url:it.l||site});
      col++;if(col>=cols){col=0;y+=bh+gap;}
    }
    rodape();doc.save("Lookbook_"+loja.replace(/\s+/g,"_")+".pdf");
  }catch(e){alert("Erro: "+e.message);}
  btn.innerText="📄 BAIXAR PDF";btn.disabled=false;
};

window.addEventListener("load",function(){
  render();var s=document.getElementById("st");
  if(window.jspdf||window.jsPDF){s.innerText="🟢 v20 Ativo";s.style.background="#dcfce7";s.style.color="#15803d";}
  else{s.innerText="🔴 Erro jsPDF";s.style.background="#fee2e2";s.style.color="#dc2626";}
});
</script>
</body>
</html>
