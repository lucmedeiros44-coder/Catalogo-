<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lookbook PDF v18.2</title>
<script src="https://cloudflare.com"></script>
<style>
*{box-sizing:border-box;font-family:sans-serif}body{margin:0;background:#f3f4f6;color:#1f2937}
.box{max-width:900px;margin:0 auto;padding:12px}.card{background:#fff;padding:14px;border-radius:10px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label{display:block;font-size:11px;font-weight:700;color:#4b5563;margin-bottom:4px;text-transform:uppercase}
input,select{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:7px;font-size:14px}
button{cursor:pointer;border:none;border-radius:7px;font-weight:700;padding:10px 14px;font-size:13px;color:#fff}
button:disabled{opacity:.6;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:8px;margin-top:10px}
.item{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:3/4;background:#e5e7eb}
.item img{width:100%;height:100%;object-fit:cover}
.del{position:absolute;top:4px;right:4px;background:#dc2626;color:#fff;border-radius:50%;width:22px;height:22px;padding:0;font-size:11px}
</style>
</head>
<body>
<div class="box">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <div><b style="font-size:18px">Lookbook PDF</b> <span id="st" style="font-size:11px;background:#fee2e2;color:#dc2626;padding:3px 7px;border-radius:6px">🔴 Erro</span></div>
    <div style="display:flex;gap:8px">
      <button id="bExtrair" style="background:#2563eb">⚡ EXTRAIR DO SITE</button>
      <button id="bPdf" style="background:#16a34a">📄 BAIXAR PDF</button>
    </div>
  </div>
  <div class="card g3">
    <div><label>Loja</label><input id="loja" value="Loja Simone Lit"></div>
    <div><label>Site</label><input id="site" value="https://simonelit.com"></div>
    <div><label>WhatsApp</label><input id="wpp" value="553132843022"></div>
  </div>
  <div class="card g3">
    <div><label>Cor Tema</label><input type="color" id="cor" value="#1e293b" style="height:38px;padding:2px"></div>
    <div><label>Fotos/Linha</label><select id="col"><option value="1">1 Grande</option><option value="2" selected>2 Padrão</option><option value="3">3 Compacto</option></select></div>
    <div><label>Capa</label><input id="capa" value="NOVA COLEÇÃO"></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between"><label>Produtos Extraídos (<span id="qtd">0</span>)</label><button id="bLimpar" style="background:#dc2626;padding:4px 8px;font-size:11px">Limpar</button></div>
    <div id="grid" class="grid"></div>
  </div>
</div>
<script>
window.onerror=function(m,u,l){document.getElementById("st").innerText="⚠️ L"+l+": "+m;};
var itens=[];
function render(){
  document.getElementById("qtd").innerText=itens.length;
  document.getElementById("grid").innerHTML=itens.map(function(it,i){return '<div class="item" title="'+it.l+'"><img src="'+it.img+'" onerror="this.parentNode.style.display=\'none\'"><button class="del" onclick="itens.splice('+i+',1);render()">✕</button></div>';}).join("");
}
document.getElementById("bLimpar").onclick=function(){itens=[];render();};

async function buscarHtml(url){
  var rotas=[
    "https://allorigins.win"+encodeURIComponent(url),
    "https://corsproxy.io?"+encodeURIComponent(url),
    "https://codetabs.com"+encodeURIComponent(url)
  ];
  for(var i=0;i<rotas.length;i++){
    try{
      var r=await fetch(rotas[i]);
      if(r.ok){var t=await r.text();if(t&&t.length>500)return t;}
    }catch(e){}
  }
  throw new Error("Não foi possível acessar o site no momento.");
}

document.getElementById("bExtrair").onclick=async function(){
  var siteUrl=document.getElementById("site").value.trim();
  if(!siteUrl)return alert("Informe a URL do site.");
  if(!/^https?:\/\//i.test(siteUrl))siteUrl="https://"+siteUrl;
  var btn=this;btn.innerText="⏳ Extraindo...";btn.disabled=true;
  try{
    var html=await buscarHtml(siteUrl);
    var doc=new DOMParser().parseFromString(html,"text/html");
    var base=new URL(siteUrl);
    var vistos={},novos=[];

    doc.querySelectorAll("a[href]").forEach(function(a){
      var img=a.querySelector("img");
      if(!img)return;
      var src=img.getAttribute("data-src")||img.getAttribute("data-lazy")||img.getAttribute("src")||"";
      if(!src&&img.getAttribute("srcset"))src=img.getAttribute("srcset").split(",").split(" ");
      if(!src||src.indexOf("data:")===0||/logo|icon|banner|flag|svg|payment/i.test(src))return;
      try{
        var fullImg=new URL(src,base.origin).href;
        var fullLink=new URL(a.getAttribute("href"),base.origin).href;
        if(fullLink===base.href||fullLink===base.origin+"/")return;
        if(!vistos[fullLink]){
          vistos[fullLink]=true;
          novos.push({img:fullImg,l:fullLink});
        }
      }catch(e){}
    });

    if(!novos.length)throw new Error("Nenhum produto com foto encontrado nesta página.");
    itens=itens.concat(novos);
    render();
  }catch(e){alert("Erro: "+e.message);}
  btn.innerText="⚡ EXTRAIR DO SITE";btn.disabled=false;
};

function toB64(u){
  if(!u||u.indexOf("data:image")===0)return Promise.resolve(u);
  return fetch("https://weserv.nl"+encodeURIComponent(u.replace(/^https?:\/\//,""))+"&w=600&output=jpg")
  .then(function(r){return r.ok?r.blob():null;}).then(function(b){return b?new Promise(function(res){var rd=new FileReader();rd.onloadend=function(){res(rd.result);};rd.readAsDataURL(b);}):null;}).catch(function(){return null;});
}

document.getElementById("bPdf").onclick=async function(){
  if(!itens.length)return alert("Extraia os produtos do site primeiro.");
  var btn=this;btn.innerText="Gerando...";btn.disabled=true;
  try{
    var Ctor=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
    if(!Ctor)throw new Error("Aguarde 2s e clique novamente (carregando PDF).");
    var doc=new Ctor(),w=doc.internal.pageSize.getWidth(),h=doc.internal.pageSize.getHeight();
    var loja=document.getElementById("loja").value,site=document.getElementById("site").value,wpp="https://wa.me"+document.getElementById("wpp").value.replace(/\D/g,"");
    var hex=document.getElementById("cor").value.replace("#",""),n=parseInt(hex,16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    var cols=parseInt(document.getElementById("col").value)||2;
    doc.setFillColor(r,g,b);doc.rect(0,0,w,h,"F");doc.setTextColor(255);doc.setFontSize(26);doc.text(loja.toUpperCase(),w/2,125,{align:"center"});
    doc.setFontSize(13);doc.text(document.getElementById("capa").value.toUpperCase(),w/2,140,{align:"center"});
    var rodape=function(){
      doc.setFillColor(r,g,b);doc.roundedRect(w-92,h-17,40,9,2,2,"F");doc.setTextColor(255);doc.setFontSize(8);doc.text("VER NO SITE",w-72,h-11,{align:"center"});doc.link(w-92,h-17,40,9,{url:site});
      doc.setFillColor(22,163,74);doc.roundedRect(w-50,h-17,40,9,2,2,"F");doc.text("WHATSAPP",w-30,h-11,{align:"center"});doc.link(w-50,h-17,40,9,{url:wpp});
    };
    doc.addPage();var m=10,gap=6,cw=(w-m*2-gap*(cols-1))/cols,ch=cols===1?220:(cols===2?115:78),col=0,y=14;
    for(var i=0;i<itens.length;i++){
      var it=itens[i];
      if(y+ch>h-22){rodape();doc.addPage();y=14;col=0;}
      var x=m+col*(cw+gap),b64=await toB64(it.img);
      if(b64)try{doc.addImage(b64,"JPEG",x,y,cw,ch);}catch(e){}else{doc.setFillColor(240);doc.rect(x,y,cw,ch,"F");}
      doc.link(x,y,cw,ch,{url:it.l||site});
      col++;if(col>=cols){col=0;y+=ch+gap;}
    }
    rodape();doc.save("Lookbook_"+loja.replace(/\s+/g,"_")+".pdf");
  }catch(e){alert("Erro: "+e.message);}
  btn.innerText="📄 BAIXAR PDF";btn.disabled=false;
};
var st=document.getElementById("st");st.innerText="🟢 v18.2 Ativo";st.style.background="#dcfce7";st.style.color="#15803d";
</script>
</body>
</html>
